<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English 4th ESO - Autonomous Self-Study Portal</title>
  <meta name="description" content="Autonomous English learning hub for 4th ESO secondary students: irregular verbs trainer, grammar guides, vocabulary with audio pronunciation, tiered exercises, and comprehensive module mastery tests.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇬🇧</text></svg>">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="brand-section">
      <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle Menu" title="Open or close the navigation sidebar">
        ☰
      </button>
      <div class="logo-badge">4th ESO</div>
      <div class="site-title">
        English Self-Study Hub
        <span>| Autonomous Learning</span>
      </div>
    </div>

    <div class="header-actions">
      <!-- Global Progress Pill -->
      <div class="progress-pill" title="Overall progress of passed exercises and tests">
        <span>🏆 Progress:</span>
        <div class="progress-bar-mini">
          <div class="progress-fill-mini" id="headerProgressFill"></div>
        </div>
        <span id="headerProgressText">0%</span>
      </div>

      <!-- Theme Switcher -->
      <button class="btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Switch dark/light theme">
        🌙 Dark Mode
      </button>
    </div>
  </header>

  <!-- Application Layout -->
  <div class="app-container">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search-box">
        <input type="text" id="sidebarSearch" placeholder="🔍 Search module, grammar, or topic...">
      </div>

      <nav class="nav-menu" id="navMenu">
        <!-- Injected dynamically via JavaScript -->
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContentArea">
      <!-- Injected dynamically via JavaScript -->
    </main>
  </div>

  <!-- Scripts: Data Files -->
  <script src="js/data/irregularVerbs.js"></script>
  <script src="js/data/introUnit.js"></script>
  <script src="js/data/module1.js"></script>
  <script src="js/data/module2.js"></script>
  <script src="js/data/module3.js"></script>
  <script src="js/data/module4.js"></script>
  <script src="js/data/module5.js"></script>
  <script src="js/data/module6.js"></script>
  <script src="js/data/moduleTests.js"></script>

  <!-- Core App Controller -->
  <script src="js/app.js"></script>
</body>
</html>
